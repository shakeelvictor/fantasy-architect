# Supabase free-tier projects pause after ~a week of inactivity — fatal for a
# seasonal app. One trivial read per week keeps the project alive. Repo
# secrets required: SUPABASE_URL, SUPABASE_ANON_KEY.
name: keep-warm
on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: touch the database
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/fold_state" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "content-type: application/json" \
            -d '{"p_season": 2027}' > /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
