# Weekly player-data refresh, v1's architecture carried over: bake from
# Sleeper, commit if changed, build + deploy. (The bake commits with the
# default token, whose pushes deliberately do NOT retrigger workflows — so
# this job deploys itself rather than relying on deploy.yml.)
#
# It also publishes a finished draft. Archiving used to be a manual ritual —
# click the button, let the JSON land in a Downloads folder, hand-commit it —
# which put the league's permanent record one forgotten step away from being
# a spreadsheet on somebody's laptop. Now the first run after a draft
# completes writes it. The step is a no-op every other run.
#
# Weekly, not daily (Sep 2026): in-season the actuals only move once a week,
# and a daily run meant a commit + deploy a day and a daily chance to fail on
# a Sleeper timeout. Tuesday picks up the week's games after Monday night.
# The cost is that an archive can land up to a week after its draft — run it
# by hand (workflow_dispatch) the morning after draft night to publish at once.
# The file and workflow keep the name daily-data so the run history stays put.
name: daily-data
on:
  schedule:
    - cron: '0 10 * * 2' # Tuesdays 10:00 UTC ≈ 6am ET
  workflow_dispatch:
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: bake players.json from Sleeper
        run: pnpm --filter @fa/bake bake
      # Runs after the bake so it sees today's pool, and skips unless the
      # draft is complete AND that pool is the season being archived.
      - name: publish a finished draft, if there is one
        run: pnpm --filter @fa/archive archive
        env:
          ARCHIVE_SEASON: '2027'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: commit if changed
        run: |
          git config user.name "fa-bake"
          git config user.email "bake@users.noreply.github.com"
          git add apps/web/public/players.json apps/web/public/actuals apps/web/public/drafts
          git diff --cached --quiet && echo "nothing changed" || {
            git commit -m "Daily data bake" && git push
          }
      # The repo is public (Oct 2026), and GitHub disables a public repo's
      # schedules after 60 days with no commits — keep-warm included, and
      # then Supabase pauses. In the off-season the bake can go months
      # without a change, so once the last commit is 30 days old this one
      # lands an empty one. Weekly runs keep the worst gap near 37 days.
      # always(): a failed bake must not also cost the keepalive.
      - name: keep the schedules alive
        if: always()
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit: $age days ago"
          if [ "$age" -ge 30 ]; then
            git config user.name "fa-bake"
            git config user.email "bake@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: $age days without a commit" && git push
          fi
      - name: build
        run: pnpm --filter @fa/web build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SEASON: '2027'
      - name: deploy to Netlify
        working-directory: apps/web
        run: pnpm --package=netlify-cli dlx netlify deploy --prod --no-build --dir apps/web/dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "daily bake"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
